<section class="contact-section">

  <form class="contact-form" action="404.html" method="get">

    <h2 class="contacth2">CONTACT US</h2>

    <div class="form-group-container">
      <div class="form-group">
        <label for="name" class="form-label">Name</label>
        <input id="name" name="name" class="form-input" placeholder="Your name" type="text">
      </div>
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input id="email" name="email" class="form-input" placeholder="Your email address" type="email">
      </div>
      <div class="form-group">
        <label for="phone" class="form-label">Phone</label>
        <input id="phone" name="phone" class="form-input" placeholder="+1 (234) 56789" type="text">
      </div>
      <div class="form-group">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-text" id="message" name="message" placeholder="Your message"></textarea>
      </div>
    </div>
    <button class="form-submit" type="submit">SEND MESSAGE</button>
  </form>

</section>
